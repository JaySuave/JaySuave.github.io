<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="shortcut icon" href="./imgs/icon.png" />

  <!-- StyleSheets -->
  <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
  <script type="module" src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.js"></script>

</head>
<body>
  <div id="main" class="relative h-screen border-b-2 lg:grid lg:grid-cols-2 lg:gap-4">
    <!-- CSS: right sight border as line seperator 
      - Phone top - down
      - Lap right left.
    -->
    <div id="left" class="left lg:my-0 my-20 ">
      <div class="imgBorder border-r-2">
        <img id='img' src="" alt="" class="img m-auto main-image rounded-lg" >
      </div>
    </div>

    <!-- Main - Contents -->
    <div id="contents" class="m-auto px-4 lg:my-20 child">
      <div id="name" class="text-center lg:text-left text-6xl"></div>
      <div id="role" class="text-center lg:text-left text-3xl"></div>
      <div id="connects" class="text-center lg:text-left text-3xl my-4">
        
      </div>
      <div id="links" class="text-center lg:text-left"></div>
    </div>
  </div>

  <section id="projects" class="border-b-2 px-4 py-16 lg:px-10 lg:py-24">
    <div class="lg:grid lg:grid-cols-2 lg:gap-4">
      <div class="section-heading lg:pr-8">
        <div class="lg:border-r-2 lg:pr-8">
          <p class="text-sm uppercase tracking-wide mb-3">Selected Work</p>
          <h2 class="text-5xl text-center lg:text-left">Projects</h2>
        </div>
      </div>

      <div class="section-content mt-12 lg:mt-0">
        <div id="projects-list" class="project-list"></div>
        <div class="mt-10">
          <a href="./projects.html" class="button-link inline-block">View All Projects</a>
        </div>
      </div>
    </div>
  </section>

  <section id="about" class="section-block border-b-2 px-4 py-16 lg:px-10 lg:py-24">
    <div class="lg:grid lg:grid-cols-2 lg:gap-4">
      <div class="section-heading lg:pr-8">
        <div class="lg:border-r-2 lg:pr-8">
          <p class="text-sm uppercase tracking-wide mb-3">Profile</p>
          <h2 class="text-5xl text-center lg:text-left">About Me</h2>
        </div>
      </div>

      <div class="section-content mt-12 lg:mt-0">
        <p id="about-text" class="text-lg leading-relaxed"></p>
        <div class="mt-10">
          <a href="./about.html" class="button-link inline-block">More About Me</a>
        </div>
      </div>
    </div>
  </section>

  <section id="contacts" class="section-block border-b-2 px-4 py-16 lg:px-10 lg:py-24">
    <div class="lg:grid lg:grid-cols-2 lg:gap-4">
      <div class="section-heading lg:pr-8">
        <div class="lg:border-r-2 lg:pr-8">
          <p class="text-sm uppercase tracking-wide mb-3">Get In Touch</p>
          <h2 class="text-5xl text-center lg:text-left">Contacts</h2>
        </div>
      </div>

      <div class="section-content mt-12 lg:mt-0">
        <div id="contacts-list" class="contact-list"></div>
      </div>
    </div>
  </section>

  <!-- <ion-icon name="heart"></ion-icon> -->
  <script src="./data.js"></script>
  <script src="./script.js"></script>
</body>
</html>
